services:
  db:
    image: postgres:16-alpine
    container_name: cinemax-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: cinemax
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: cinemax-backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:hoilamcaigi@host.docker.internal:5432/cinemax?schema=public"
      PORT: 3000
    depends_on:
      - db

volumes:
  postgres_data: